name: retsu
channels:
  - nodefaults
  - conda-forge
dependencies:
  - python >=3.10,<4
  - pip
  - poetry
  # Keep semantic-release on a stable LTS runtime. Node 26 currently breaks
  # @semantic-release/github release-asset uploads with an Undici
  # "invalid content-length header" error.
  - nodejs >=22,<23
