project:
  type: website
  output-dir: build
  render:
    - docs/*.md
    - docs/api/*.md
    - docs/*.ipynb

website:
  title: Retsu
  site-url: https://osl-incubator.github.io/retsu
  repo-url: https://github.com/osl-incubator/retsu
  favicon: docs/images/favicon.ico
  page-navigation: true
  navbar:
    logo: docs/images/logo.png
    left:
      - text: Home
        href: docs/index.md
      - text: Quickstart
        href: docs/quickstart.md
      - text: Concepts
        href: docs/concepts.md
      - text: Guard Mode
        href: docs/guard-mode.md
      - text: Admission Mode
        href: docs/admission-mode.md
      - text: Integrations
        href: docs/integrations.md
      - text: API
        href: docs/api/references.md
    right:
      - icon: github
        href: https://github.com/osl-incubator/retsu
  sidebar:
    style: docked
    contents:
      - text: Home
        href: docs/index.md
      - text: Quickstart
        href: docs/quickstart.md
      - text: Installation
        href: docs/installation.md
      - text: Concepts
        href: docs/concepts.md
      - text: Guard Mode
        href: docs/guard-mode.md
      - text: Admission Mode
        href: docs/admission-mode.md
      - text: Integrations
        href: docs/integrations.md
      - text: Operations
        href: docs/operations.md
      - section: API
        contents:
          - text: Reference
            href: docs/api/references.md
      - text: Notebook Tour
        href: docs/example.ipynb
      - text: Changelog
        href: docs/changelog.md
      - text: Contributing
        href: docs/contributing.md
  page-footer:
    left: "Copyright &copy; 2022, Retsu Team"
    right:
      - icon: github
        href: https://github.com/osl-incubator/retsu

format:
  html:
    theme:
      light: cosmo
      dark: darkly
    toc: true
    code-copy: true
    code-overflow: wrap
    link-external-newwindow: true

execute:
  enabled: false
  freeze: auto
